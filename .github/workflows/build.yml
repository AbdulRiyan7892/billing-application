name: Build Desktop Apps (macOS & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build macOS DMG & App
        run: npm run desktop:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: Arif-Veneer-Billing-macOS-DMG
          path: |
            release/*.dmg
            release/*.zip

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run desktop:build:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Arif-Veneer-Billing-Windows-Setup
          path: release/*.exe
